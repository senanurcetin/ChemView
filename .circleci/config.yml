version: 2.1

# Read-only quality checks mirroring the existing GitHub Actions CI.
# No production credentials, live Modbus devices, or deployment.
jobs:
  node-quality:
    docker:
      - image: cimg/node:20.19
    resource_class: medium
    working_directory: ~/project
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - chemview-npm-v1-{{ checksum "package-lock.json" }}
            - chemview-npm-v1-
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: chemview-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: TypeScript checks
          command: npm run typecheck
      - run:
          name: ESLint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Production build
          command: npm run build
          no_output_timeout: 15m

workflows:
  verify:
    jobs:
      - node-quality
