name: ChemView CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit full and production-only dependencies
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "for (const name of ['full', 'production']) { const data = require('./npm-audit-' + name + '.json'); console.log(name, JSON.stringify(data.metadata?.vulnerabilities ?? {})); }"

      - name: Save dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemview-dependency-audit
          path: |
            npm-audit-full.json
            npm-audit-production.json
          retention-days: 14
          if-no-files-found: warn

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Documentation links and screenshot integrity
        run: npm run docs:check

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  firestore-emulator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Store contract tests against the Firestore emulator
        run: npm run test:firestore

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload current HMI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemview-hmi-design-captures
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  documentation-inventory:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/repository-docs-visual-refresh-20261021'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Inspect tracked files and document links
        run: |
          git ls-files > chemview-inventory.txt
          echo '--- documentation and image files ---' >> chemview-inventory.txt
          git ls-files | grep -E '(^docs/|\\.(md|png|jpg|svg|webp)$)' >> chemview-inventory.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: chemview-maintenance-inventory
          path: chemview-inventory.txt
          retention-days: 3

  portfolio-screenshot-refresh:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/repository-docs-visual-refresh-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-docs-visual-refresh-20261021
          persist-credentials: true
      - name: Download last successful full-page ChemView Playwright captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39515611615 --repo "$GITHUB_REPOSITORY" --name chemview-hmi-design-captures --dir "$RUNNER_TEMP/hmi-images"
          test -s "$RUNNER_TEMP/hmi-images/chemview-hmi-1366x768.png"
          test -s "$RUNNER_TEMP/hmi-images/chemview-hmi-1440x900.png"
          test -s "$RUNNER_TEMP/hmi-images/chemview-hmi-1920x1080.png"
      - name: Refresh canonical and workstation images
        run: |
          cp "$RUNNER_TEMP/hmi-images/chemview-hmi-1440x900.png" docs/assets/chemview-dashboard.png
          cp "$RUNNER_TEMP/hmi-images/chemview-hmi-1366x768.png" docs/assets/chemview-1366x768.png
          cp "$RUNNER_TEMP/hmi-images/chemview-hmi-1920x1080.png" docs/assets/chemview-1920x1080.png
          sha256sum docs/assets/*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "Source screenshots are already current."
          else
            git commit -m "docs(visual): refresh real NEXUS workstation captures from verified CI"
            git push origin HEAD:chore/repository-docs-visual-refresh-20261021
          fi

  documentation-prettier-refresh:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/repository-docs-visual-refresh-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-docs-visual-refresh-20261021
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Apply repository formatting to canonical docs and checker
        run: |
          npx prettier --write README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md docs/*.md .github/copilot-instructions.md .github/agents/*.md scripts/check-docs.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md docs .github/copilot-instructions.md .github/agents scripts/check-docs.mjs
          if git diff --cached --quiet; then
            echo "Docs are already formatted."
          else
            git commit -m "style(docs): apply canonical Prettier formatting and restore strict CI"
            git push origin HEAD:chore/repository-docs-visual-refresh-20261021
          fi
