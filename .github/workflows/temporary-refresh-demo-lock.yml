name: Temporary one-time dependency lockfile refresh
on:
  push:
    branches:
      - fix/demo-transitive-security-20261021

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate only the package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Validate lockfile and installation
        run: |
          git diff --check
          npm ci --ignore-scripts --no-audit

      - name: Commit lockfile on the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "fix(security): regenerate lockfile for patched transitive dependencies"
            git push origin HEAD:fix/demo-transitive-security-20261021
          fi
